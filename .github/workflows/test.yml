name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: [3.9, 3.10, 3.11]
        
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-
          ${{ runner.os }}-pip-
          
    - name: Install system dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-dev python3-pip python3-venv
        sudo apt-get install -y libx11-dev libxext-dev libxrender-dev libxinerama-dev libxi-dev
        sudo apt-get install -y libxrandr-dev libxcursor-dev libxtst-dev libxss-dev
        
    - name: Install system dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install python3
        brew install xquartz
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r desktop-app/backend/requirements.txt
        pip install -r desktop-app/backend/requirements-test.txt
        
    - name: Run database schema tests
      working-directory: desktop-app/backend
      run: |
        python -m pytest tests/test_database_schema.py -v --cov=cerebro_db --cov-report=term-missing
        
    - name: Run idle detection tests
      working-directory: desktop-app/backend
      run: |
        python -m pytest tests/test_idle_detection.py -v --cov=idle_monitor --cov-report=term-missing
        
    - name: Run focus timer tests
      working-directory: desktop-app/backend
      run: |
        python -m pytest tests/test_focus_timer.py -v --cov=focus_timer --cov-report=term-missing
        
    - name: Run app usage logging tests
      working-directory: desktop-app/backend
      run: |
        python -m pytest tests/test_app_usage_logging.py -v --cov=window_tracker --cov-report=term-missing
        
    - name: Run all tests with coverage
      working-directory: desktop-app/backend
      run: |
        python -m pytest tests/ -v --cov=. --cov-report=term-missing --cov-report=html --cov-report=xml
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./desktop-app/backend/coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        
    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results-${{ matrix.os }}-${{ matrix.python-version }}
        path: |
          desktop-app/backend/htmlcov/
          desktop-app/backend/.coverage
          desktop-app/backend/coverage.xml
          
  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11
        
    - name: Install linting dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort mypy
        
    - name: Run flake8
      working-directory: desktop-app/backend
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        
    - name: Run black
      working-directory: desktop-app/backend
      run: |
        black --check --diff .
        
    - name: Run isort
      working-directory: desktop-app/backend
      run: |
        isort --check-only --diff .
        
    - name: Run mypy
      working-directory: desktop-app/backend
      run: |
        mypy --ignore-missing-imports --no-strict-optional .
        
  security:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11
        
    - name: Install security dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety
        
    - name: Run bandit security scan
      working-directory: desktop-app/backend
      run: |
        bandit -r . -f json -o bandit-report.json || true
        
    - name: Run safety check
      working-directory: desktop-app/backend
      run: |
        safety check --json --output safety-report.json || true
        
    - name: Upload security reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-reports
        path: |
          desktop-app/backend/bandit-report.json
          desktop-app/backend/safety-report.json
